name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy .

      # No API key is configured, and none is needed: every test is offline by
      # construction. The judges are exercised through their request builders so
      # that isolation can be asserted on the payload without paying for a call.
      - name: Tests
        run: uv run pytest -q
